<!DOCTYPE html>
<html lang="en" data-title-key="thanks.title">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — gift.ceo</title>
<meta name="description" content="Your seat is being activated.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css?v=13">
</head>
<body>

<header class="masthead" data-chrome></header>

<main class="wrap narrow" style="padding-top:70px;padding-bottom:60px;text-align:center">
  <div class="card">
    <h1 style="margin:0 0 12px;font:700 1.6rem/1.25 var(--sans);letter-spacing:-.025em" data-i18n="thanks.title">Your seat is being activated…</h1>
    <p style="color:var(--dim)" data-i18n="thanks.body"></p>
    <p style="color:var(--faint);font-size:.9rem" id="status" data-i18n="thanks.waiting"></p>
    <p><a class="btn btn--ghost" href="/dashboard.html" data-i18n="nav.dashboard">Dashboard</a></p>
  </div>
</main>

<footer class="foot" data-footer></footer>

<script type="module">
import { boot, sb, t } from "/assets/app.js?v=13";

const user = await boot();

// Stripe confirms the payment to the webhook, not to the browser, so this page
// waits on the database rather than on anything the redirect carried with it.
// It backs off instead of hammering, and gives up quietly after two minutes —
// the seat still activates, the dashboard will simply show it later.
let tries = 0;
async function poll() {
  if (!user) { location.href = "/join.html"; return; }
  const { data } = await sb.from("ceos")
    .select("companies(seat_status)").eq("user_id", user.id).eq("is_current", true).limit(1);
  const st = data && data[0] && data[0].companies ? data[0].companies.seat_status : null;
  if (st === "active") { location.href = "/dashboard.html"; return; }
  if (++tries > 24) {
    document.getElementById("status").textContent = t("errors.generic");
    return;
  }
  setTimeout(poll, Math.min(1000 * tries, 5000));
}
poll();
</script>

</body>
</html>
