<!DOCTYPE html>
<html lang="en" data-title-key="join.title">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take your company's seat — gift.ceo</title>
<meta name="description" content="Sign in with your company Google Workspace account and take your company's seat on gift.ceo.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://gift.ceo/join.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css?v=11">
</head>
<body>

<header class="masthead" data-chrome></header>

<main class="wrap narrow" style="padding-top:52px;padding-bottom:40px">

  <h1 style="font:800 2rem/1.15 var(--sans);letter-spacing:-.03em;margin:0 0 22px" data-i18n="join.title">Take your company's seat</h1>

  <div class="error" id="err"></div>

  <!-- Step 1: not signed in -->
  <section class="card" id="stepSignIn" hidden>
    <p data-i18n="join.no_hd">Sign in with your company Google Workspace account (@yourcompany.com).</p>
    <p><button class="btn" id="btnSignIn" data-i18n="join.signin_cta">Sign in with Google</button></p>
    <p class="note" data-i18n="how.step1"></p>
  </section>

  <!-- Step 2: signed in with a personal account -->
  <section class="card" id="stepNoHd" hidden>
    <p class="error" style="margin-top:0" data-i18n="join.no_hd"></p>
    <p><button class="btn btn--ghost btn--sm" id="btnSwitch" data-i18n="join.signin_cta">Sign in with Google</button></p>
  </section>

  <!-- Step 3: the form -->
  <section class="card" id="stepForm" hidden>
    <p class="note" id="asDomain"></p>

    <form id="form" novalidate>
      <div class="field">
        <label for="name" data-i18n="join.company_name">Company name</label>
        <input id="name" name="name" type="text" maxlength="120" required autocomplete="organization">
      </div>

      <div class="field">
        <label for="website" data-i18n="join.website">Company website</label>
        <input id="website" name="website" type="url" required autocomplete="url">
        <p class="hint" id="websiteHint"></p>
      </div>

      <div class="field">
        <label for="country" data-i18n="join.country">Country</label>
        <select id="country" name="country" required></select>
      </div>

      <div class="field">
        <label for="ceo_name" data-i18n="join.ceo_name">Your name, as it should appear</label>
        <input id="ceo_name" name="ceo_name" type="text" maxlength="120" required autocomplete="name">
      </div>

      <div class="field">
        <label for="linkedin" data-i18n="join.linkedin">LinkedIn (optional)</label>
        <input id="linkedin" name="linkedin" type="url" autocomplete="off">
      </div>

      <label class="check">
        <input type="checkbox" id="declare" required>
        <span data-i18n="join.declaration">I am the CEO of this company and authorized to publish on its behalf.</span>
      </label>

      <label class="check">
        <input type="checkbox" id="accept" required>
        <span data-i18n="join.terms_accept">I have read and accept the Terms.</span>
      </label>

      <p style="margin-top:22px">
        <button class="btn btn--gold" type="submit" id="submit" data-i18n="join.submit">Continue to payment — 10,000 CHF</button>
      </p>
    </form>
  </section>

  <!-- Step 4: the company already holds a seat -->
  <section class="card" id="stepTakeover" hidden>
    <h2 style="margin-top:0;font:600 1.15rem/1.3 var(--sans)" data-i18n="join.takeover_title">This company already has a seat</h2>
    <p data-i18n="join.takeover_body"></p>
    <p><button class="btn" id="btnTakeover" data-i18n="join.takeover_cta">Take over this seat</button></p>
  </section>

</main>

<footer class="foot" data-footer></footer>

<script type="module">
import { boot, sb, t, hdOf, signIn, SUPABASE_URL, SUPABASE_KEY, lang } from "/assets/app.js?v=11";

const err = document.getElementById("err");
const show = id => document.getElementById(id).hidden = false;
const hide = id => document.getElementById(id).hidden = true;
const fail = msg => { err.textContent = msg; err.scrollIntoView({ block: "nearest" }); };

// ISO 3166-1 alpha-2. The names come from Intl.DisplayNames so the list is in
// the visitor's language without shipping 38 copies of it.
const ISO2 = ("AD AE AF AG AI AL AM AO AR AT AU AW AZ BA BB BD BE BF BG BH BI BJ BN BO BR BS BT BW BY BZ " +
  "CA CD CF CG CH CI CL CM CN CO CR CU CV CY CZ DE DJ DK DM DO DZ EC EE EG ER ES ET FI FJ FM FR GA GB GD " +
  "GE GH GM GN GQ GR GT GW GY HN HR HT HU ID IE IL IN IQ IR IS IT JM JO JP KE KG KH KI KM KN KP KR KW KZ " +
  "LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MG MH MK ML MM MN MR MT MU MV MW MX MY MZ NA NE NG NI NL " +
  "NO NP NR NZ OM PA PE PG PH PK PL PT PW PY QA RO RS RU RW SA SB SC SD SE SG SI SK SL SM SN SO SR SS ST " +
  "SV SY SZ TD TG TH TJ TL TM TN TO TR TT TV TZ UA UG US UY UZ VA VC VE VN VU WS YE ZA ZM ZW").split(" ");

function fillCountries(selected) {
  const sel = document.getElementById("country");
  let names;
  try { names = new Intl.DisplayNames([lang], { type: "region" }); } catch (e) { names = null; }
  const list = ISO2.map(c => ({ c, n: names ? (names.of(c) || c) : c }))
                   .sort((a, b) => a.n.localeCompare(b.n, lang));
  sel.innerHTML = "";
  for (const { c, n } of list) {
    const o = document.createElement("option");
    o.value = c; o.textContent = n;
    sel.appendChild(o);
  }
  sel.value = selected || "CH";
}

// The seat is tied to the Google Workspace domain, so the website field is
// only ever a courtesy: whatever is typed, the domain must be the one Google
// vouched for, and the database enforces that too.
function domainOf(raw) {
  try {
    const u = new URL(/^https?:\/\//i.test(raw) ? raw : "https://" + raw);
    return u.hostname.replace(/^www\./i, "").toLowerCase();
  } catch (e) { return null; }
}

async function callEdge(fn, body, token) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${fn}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${token}`
    },
    body: JSON.stringify(body)
  });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(out.error || `HTTP ${res.status}`);
  return out;
}

let user = null, hd = null;

async function render() {
  err.textContent = "";
  ["stepSignIn", "stepNoHd", "stepForm", "stepTakeover"].forEach(hide);

  if (!user) { show("stepSignIn"); return; }

  hd = hdOf(user);
  if (!hd) { show("stepNoHd"); return; }

  // Already holds a seat here? Then this is a handover, not a purchase.
  const { data: existing } = await sb.from("companies")
    .select("id,name,seat_status").eq("domain", hd).maybeSingle();

  if (existing && existing.seat_status === "active") {
    show("stepTakeover");
    return;
  }

  document.getElementById("asDomain").textContent =
    `${t("join.company_name")}: @${hd} — ${user.email}`;
  document.getElementById("websiteHint").textContent =
    t("join.domain_mismatch") + ` (${hd})`;
  document.getElementById("website").value = `https://${hd}`;
  document.getElementById("ceo_name").value =
    (user.user_metadata && user.user_metadata.full_name) || "";
  fillCountries("CH");
  show("stepForm");
}

document.getElementById("btnSignIn").addEventListener("click", () => signIn(location.href));
document.getElementById("btnSwitch").addEventListener("click", () => signIn(location.href));

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  err.textContent = "";
  const btn = document.getElementById("submit");
  const website = document.getElementById("website").value.trim();

  if (domainOf(website) !== hd) { fail(t("join.domain_mismatch")); return; }
  if (!document.getElementById("declare").checked ||
      !document.getElementById("accept").checked) { fail(t("errors.generic")); return; }

  btn.disabled = true;
  try {
    const { data: { session } } = await sb.auth.getSession();
    const out = await callEdge("claim-seat", {
      name: document.getElementById("name").value.trim(),
      website,
      country: document.getElementById("country").value,
      ceo_name: document.getElementById("ceo_name").value.trim(),
      linkedin_url: document.getElementById("linkedin").value.trim() || null,
      lang
    }, session.access_token);
    location.href = out.checkout_url;
  } catch (e2) {
    fail(e2.message || t("errors.generic"));
    btn.disabled = false;
  }
});

document.getElementById("btnTakeover").addEventListener("click", async () => {
  err.textContent = "";
  try {
    const { data: { session } } = await sb.auth.getSession();
    await callEdge("claim-seat", { takeover: true, lang }, session.access_token);
    location.href = "/dashboard.html";
  } catch (e2) { fail(e2.message || t("errors.generic")); }
});

user = await boot();
await render();
sb.auth.onAuthStateChange(async (_e, session) => {
  user = session ? session.user : null;
  await render();
});
</script>

</body>
</html>
