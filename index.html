<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gift.ceo</title>
<meta name="description" content="gift.ceo — a site is being built here.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://gift.ceo/">

<!-- Deliberately plain. Nothing here claims to be a product yet: no brand, no
     promises, no sign-up. It exists so the domain answers with something of
     its own instead of a 404, and so GitHub has a page to issue the
     certificate against. Replace the whole file once the site has a purpose. -->

<style>
  :root{
    --bg:#faf9f7; --card:#ffffff; --ink:#1c1b19; --dim:#6b6864;
    --line:#e6e3de; --accent:#b8860b;
  }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141311; --card:#1c1b19; --ink:#f2f0ec; --dim:#9b968e;
      --line:#2c2a27; --accent:#d4a017;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141311; --card:#1c1b19; --ink:#f2f0ec; --dim:#9b968e;
    --line:#2c2a27; --accent:#d4a017;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    max-width:460px; width:100%; padding:40px 36px; text-align:center;
  }
  h1{
    margin:0 0 6px; font-size:2rem; letter-spacing:-.02em; font-weight:800;
  }
  h1 .dot{color:var(--accent);}
  p{margin:0; color:var(--dim); font-size:.96rem;}
  .rule{
    width:32px; height:3px; background:var(--accent); border-radius:2px;
    margin:18px auto;
  }
  footer{
    margin-top:26px; padding-top:18px; border-top:1px solid var(--line);
    font-size:.82rem; color:var(--dim);
  }
  footer a{color:var(--dim);}
</style>
</head>
<body>

  <main class="card">
    <h1>gift<span class="dot">.</span>ceo</h1>
    <div class="rule"></div>
    <p>A site is being built here.</p>
    <footer>
      Registered 2026. Nothing to sign up for yet.
    </footer>
  </main>

</body>
</html>
